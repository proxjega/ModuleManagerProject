<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Info</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'ModuleManagerApp/styles.css' %}">
</head>
<body class="app-page">
    <main class="page">
        <div class="top-row">
            <h1>{{ module.title }}</h1>
            <div class="actions">
                <a class="button" href="{% url 'modules' %}">Back to modules</a>
            </div>
        </div>

        <div class="module-card">
            <p class="module-meta">Teacher: {{ module.teacher }}</p>
            {% if module.description %}
                <p class="module-description">{{ module.description }}</p>
            {% else %}
                <p class="module-description">No description added yet.</p>
            {% endif %}
            <div class="module-actions">
                <a class="button" >Redact</a>
                <a class="button" >PDF</a>
                <a class="button danger" >Delete</a>
            </div>
        </div>
    </main>
</body>
</html>
