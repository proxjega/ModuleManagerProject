<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Module</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'ModuleManagerApp/styles.css' %}">
</head>
<body class="app-page">
    <main class="page">
        <div class="top-row">
            <h1>Delete Module</h1>
        </div>

        <p class="subtitle">Are you sure you want to delete this module?</p>

        <div class="module-card">
            <h2>{{ module.title }}</h2>
            <p class="module-meta">Teacher: {{ module.teacher }}</p>
            {% if module.description %}
                <p class="module-description">{{ module.description }}</p>
            {% else %}
                <p class="module-description">No description added yet.</p>
            {% endif %}
        </div>

        <div class="footer-actions">
            <form method="post" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="button">Delete module</button>
            </form>
            <a class="button" href="{% url 'modules' %}">Cancel</a>
        </div>
    </main>
</body>
</html>
